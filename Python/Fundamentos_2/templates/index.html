<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar retângulo</title>
</head>
<body>
  <h1>Criar retângulo</h1>

  <form method="post">
    <p>
      <label for="lado">Quantidade de colunas:</label>
      <input id="lado" name="lado" type="number" min="1" required>
    </p>
    <p>
      <label for="altura">Altura:</label>
      <input id="altura" name="altura" type="number" min="1" required>
    </p>
    <p>
      <label for="simbolo">Símbolo:</label>
      <input id="simbolo" name="simbolo" type="text" maxlength="1" required>
    </p>
    <button type="submit">Criar retângulo</button>
  </form>

  {% if retangulo is not none %}
    <h2>Resultado</h2>
    <pre>{{ retangulo }}</pre>
  {% endif %}

  {% if erro %}
    <p>{{ erro }}</p>
  {% endif %}
</body>
</html>
